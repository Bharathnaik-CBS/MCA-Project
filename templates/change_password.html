<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        form { max-width: 400px; margin: auto; }
        input { display: block; margin-bottom: 10px; width: 100%; padding: 8px; }
        .flash { margin-bottom: 15px; padding: 10px; border-radius: 5px; }
        .flash.success { background: #c6f6d5; color: #22543d; }
        .flash.error { background: #fed7d7; color: #742a2a; }
    </style>
</head>
<body>

    <h2>Change Password</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <input type="password" name="current_password" placeholder="Current Password" required>
        <input type="password" name="new_password" placeholder="New Password" required>
        <input type="password" name="confirm_password" placeholder="Confirm New Password" required>
        <button type="submit">Change Password</button>
    </form>

</body>
</html>
