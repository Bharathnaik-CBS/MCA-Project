<!-- templates/forgot_password.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Forgot Password</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    form { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; }
    input { width: 84%; margin-top: 10px; padding: 10px; }
    button { width: 90%; margin-top: 10px; padding: 10px; }
    .flash { color: red; text-align: center; }
  </style>
</head>

<body>
  <h2 style="text-align: center;">Forgot Password</h2>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash">
        {% for category, message in messages %}
          <p class="{{ category }}">{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}
  <form action="/send-otp" method="POST">
    <label for="email">Enter your registered email:</label>
    <input type="email" name="email" required>
    <button type="submit">Send OTP</button>
  </form>
</body>

</html>
